<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnolia · Quote Studio</title><style>
:root{--ink:#153c31;--gold:#b89a5c;--paper:#f5f3ed;--muted:#63736b;--line:#d8dfd8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,sans-serif}header{background:var(--ink);color:#fff;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font:24px Georgia;letter-spacing:3px}header a{color:#e5d5af}main{max-width:1280px;margin:auto;padding:35px 24px}h1{font:44px/1.1 Georgia;margin:10px 0}h2{font:27px Georgia;margin:0 0 16px}h3{margin:0 0 10px}p{margin:8px 0 18px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--gold)}.hint,small{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.panel{background:white;border:1px solid var(--line);padding:24px;border-radius:16px;margin:20px 0;box-shadow:0 8px 25px #17372b05}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fafbf8;border:1px solid #b8c6bd;border-radius:8px;padding:11px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:2px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}.checks label{flex-direction:row;align-items:center}.checks input{width:auto;accent-color:var(--ink)}button,.button{border:1px solid var(--ink);border-radius:8px;padding:12px 16px;background:var(--ink);color:white;font:600 14px system-ui;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:white;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.options{display:grid;gap:12px}.option{background:white;text-align:left;border:1px solid var(--line);color:var(--ink);display:grid;grid-template-columns:1fr auto;gap:8px;padding:18px}.option[aria-pressed=true]{border:2px solid var(--ink);background:#edf3ed}.price{font:31px Georgia}.option small{font-weight:400;display:block}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{padding:14px;background:#edf2ed;border-radius:9px}.metric strong{display:block;font:24px Georgia}.notice{padding:13px 16px;background:#fff7e4;border-left:3px solid var(--gold);margin:14px 0;font-size:13px}.breakdown{width:100%;border-collapse:collapse}.breakdown td{border-bottom:1px solid var(--line);padding:9px 0}.breakdown td:last-child{text-align:right}.saved{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:12px 0}.saved button{padding:7px 12px}details{margin-top:18px}summary{cursor:pointer;font-weight:650}#printout{display:none}.login{max-width:460px;margin:60px auto}.login label{margin:20px 0}#status{min-height:24px}header small{color:#bdd0c2}#syncStatus{font-size:12px}footer{margin:28px 0;color:var(--muted);font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}h1{font-size:36px}.panel{padding:18px}main{padding:24px 16px}header{padding:16px;flex-wrap:wrap}.metrics{gap:6px}.metric{padding:10px}.metric strong{font-size:21px}}@media print{body{background:white;color:black}header,main{display:none!important}#printout{display:block;padding:30px;font:14px/1.6 system-ui}#printout h1{font-size:32px}#printout .total{font-size:32px;border-top:2px solid;padding-top:15px}#printout p{white-space:pre-wrap}}

/* Everyday quote screen: two main choices, detail on demand. */
main{max-width:1060px;padding-top:28px}.simple-top{text-align:center;margin-bottom:28px}.simple-top h1{font-size:46px;margin:10px 0}.simple-top p{font-size:15px}.quick-layout{display:grid;grid-template-columns:1.08fr 1fr;gap:24px;align-items:start}.quick-form{margin:0;padding:30px}.step-label{display:flex;align-items:center;gap:12px;color:#a08b56;font-size:12px;letter-spacing:1px;margin:5px 0 18px}.step-label span{color:var(--ink);font-size:17px;font-weight:650;letter-spacing:0}.area-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.area-input{position:relative;margin-bottom:32px}.area-input input{font:38px Georgia;padding:16px 80px 16px 18px;background:#f5f7f2;border-radius:12px}.area-input>span{position:absolute;right:20px;top:25px;color:var(--muted)}.clean-picker{display:grid;gap:10px}.clean-tile{display:flex;align-items:center;gap:14px;padding:15px;text-align:left;background:white;color:var(--ink);border:1px solid var(--line);border-radius:12px;transition:background .18s,border .18s,transform .18s}.clean-tile strong{display:block;font-size:15px}.clean-tile small{display:block;font-weight:400;margin-top:3px;font-size:12px}.clean-tile[aria-pressed=true]{background:#eaf1e7;border-color:#4f7758;box-shadow:0 0 0 1px #4f7758}.tile-dot{display:grid;place-items:center;flex-shrink:0;border:1px solid #bdcbbf;width:24px;height:24px;border-radius:50%;font-size:13px}.clean-tile[aria-pressed=true] .tile-dot{background:var(--ink);color:white;border-color:var(--ink)}.clean-tile:hover{transform:translateY(-1px)}.optional{border-top:1px solid var(--line);margin-top:20px;padding-top:4px}.optional summary{font-size:13px;padding:12px 0}.optional .grid{margin-top:12px}.owner-settings summary{color:var(--muted)}.price-panel{padding:30px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 36px #153c3108}.scope-line{margin:18px 0 0;color:var(--muted);font-size:14px}.hero-price{font:64px/1.15 Georgia;margin:12px 0 2px;letter-spacing:-2px;animation:priceIn .2s ease-out}.price-caption{font-size:13px;color:var(--muted);margin-bottom:20px}.included{display:grid;gap:7px;font-size:13px;color:#4a6f52;padding:15px 0;border-top:1px solid var(--line)}.primary-action{width:100%;padding:16px;margin-top:22px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{padding:11px 9px}.device-note{color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:12px;margin-bottom:0}.saved-panel{padding:16px 22px;margin:16px 0}.saved-panel>summary{font-size:14px}.saved-count{float:right;color:#7d8f7e}.simple-note{font-size:11px;color:var(--muted);padding:0 8px}footer{text-align:center;font-size:11px}.option{grid-template-columns:1fr auto;border-radius:9px;font-size:13px}header strong{font-size:20px}header{padding:16px 5%}#syncStatus{font-size:10px;max-width:150px}.metric strong{font-size:22px}@keyframes priceIn{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:760px){.quick-layout{grid-template-columns:1fr;gap:18px}.simple-top h1{font-size:35px}.simple-top{text-align:left;margin-bottom:22px}.quick-form,.price-panel{padding:22px}main{padding:23px 16px}.hero-price{font-size:58px}header{gap:9px}header small{font-size:10px}header a{font-size:12px}#syncStatus{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><div><strong>MAGNOLIA</strong><br><small>OWNER TOOLS / QUOTE STUDIO</small></div><a href="/">← Sales workspace</a><span id="syncStatus">Opening your workspace…</span></header><main id="view"><p>Opening Quote Studio…</p></main><section id="printout"></section>
<script src="/adapter.js"></script><script>
'use strict';
const defaults={sqft:2500,condition:1,rough:false,final:true,touch:false,visits:1,crew:2,windows:0,windowMinutes:12,extraHours:0,miles:10,travelMinutes:20,pay:24,burden:20,supplies:35,equipment:0,mileage:.75,overhead:12,contingency:10,minimum:350,roughSpeed:500,finalSpeed:250,touchSpeed:650,baseRate:.4,lowMargin:25,midMargin:35,highMargin:45,competitor:0,client:'',project:'',notes:'',owner:'Bashar',choice:1};
const key='magnolia-quote-studio-v1';let state={...defaults},saved=[],storageOK=true;const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date());
function calculate(s){
 const phases=[s.rough?s.sqft/s.roughSpeed:0,s.final?s.sqft/s.finalSpeed:0,s.touch?s.sqft/s.touchSpeed:0];
 const hours=phases.reduce((a,b)=>a+b,0)*s.condition+s.windows*s.windowMinutes/60+s.extraHours;
 const travelHours=s.visits*2*s.travelMinutes/60*s.crew;const labor=(hours+travelHours)*s.pay*(1+s.burden/100);
 const travel=s.miles*2*s.visits*s.mileage;const direct=labor+s.supplies+s.equipment+travel;
 const reserve=direct*s.contingency/100;const overhead=(direct+reserve)*s.overhead/100;const cost=direct+reserve+overhead;
 const floor=Math.max(s.minimum,cost/(1-s.lowMargin/100));const phaseWeight=(s.rough?s.finalSpeed/s.roughSpeed:0)+(s.final?1:0)+(s.touch?s.finalSpeed/s.touchSpeed:0);const market=s.sqft*s.baseRate*phaseWeight;
 const prices=[floor,Math.max(floor,market,cost/(1-s.midMargin/100)),Math.max(floor,market,cost/(1-s.midMargin/100),cost/(1-s.highMargin/100))].map(n=>Math.ceil(n/5)*5);
 return {hours,travelHours,labor,travel,direct,reserve,overhead,cost,floor,prices,duration:hours/s.crew};
}
function num(id,label,min=0,max=100000,step='any'){return '<label>'+label+'<input id="'+id+'" type="number" min="'+min+'" max="'+max+'" step="'+step+'" value="'+state[id]+'" required></label>'}
function field(id,label){return '<label>'+label+'<input id="'+id+'" maxlength="180" value="'+esc(state[id])+'"></label>'}
function persist(){try{localStorage.setItem(key,JSON.stringify({draft:state,saved}));return true}catch{storageOK=false;$('status').textContent='This browser cannot save. Export your estimate before closing.';return false}}
function valid(){const inputs=[...$('quoteForm').querySelectorAll('input')];return inputs.every(i=>i.checkValidity())&&(state.rough||state.final||state.touch)&&state.lowMargin<=state.midMargin&&state.midMargin<=state.highMargin&&state.visits>=[state.rough,state.final,state.touch].filter(Boolean).length}

function cleanName(){return state.rough&&state.final&&state.touch?'Complete package':state.rough&&state.final?'Rough + final':state.rough?'Rough clean':state.touch&&!state.final?'Touch-up':'Final clean'}
function chooseClean(kind){state.rough=kind==='rough'||kind==='complete';state.final=kind==='final'||kind==='complete';state.touch=kind==='touch'||kind==='complete';state.visits=kind==='complete'?3:1;state.choice=1;render();persist()}
function render(){
 $('view').innerHTML='<div class="simple-top"><div class="eyebrow">Magnolia Quote Studio</div><h1>Let’s price your clean.</h1><p class="hint">Enter the size. Choose the clean. Your estimate is ready.</p></div><div class="quick-layout"><form id="quoteForm" class="panel quick-form" novalidate><div class="step-label">01 <span>How big is the space?</span></div><label class="area-label" for="sqft">Square footage</label><div class="area-input"><input id="sqft" type="number" inputmode="numeric" min="1" max="10000000" step="any" value="'+state.sqft+'" required><span>sq ft</span></div><div class="step-label">02 <span>What kind of clean?</span></div><div class="clean-picker">'+[['final','Final clean','Detailed clean after the work is finished'],['rough','Rough clean','Initial clean during construction'],['touch','Touch-up','A light return visit after the final clean'],['complete','Complete package','Rough, final & touch-up · 3 visits']].map(([key,title,desc])=>{const chosen=key==='complete'?(state.rough&&state.final&&state.touch):key==='final'?(!state.rough&&state.final&&!state.touch):key==='rough'?(state.rough&&!state.final&&!state.touch):(!state.rough&&!state.final&&state.touch);return '<button type="button" class="clean-tile" data-kind="'+key+'" aria-pressed="'+chosen+'"><span class="tile-dot">'+(chosen?'✓':'')+'</span><span><strong>'+title+'</strong><small>'+desc+'</small></span></button>'}).join('')+'</div><details class="optional"><summary>Heavy dust, windows or extras?</summary><p class="hint">Leave these alone for a standard job. Change only what applies.</p><div class="grid"><label>Site condition<select id="condition"><option value="0.8">Light dust</option><option value="1">Standard dust</option><option value="1.5">Heavy dust</option><option value="2">Very heavy dust</option></select></label>'+num('windows','Window units · both sides',0,10000,1)+num('extraHours','Extra person-hours',0,10000)+num('visits','Site visits',1,100,1)+num('miles','One-way travel · miles',0,1000)+num('travelMinutes','One-way drive · minutes',0,1440)+'</div></details><details class="optional"><summary>Customer details · optional</summary><div class="grid">'+field('client','Client / company')+field('project','Project reference')+'<label>Prepared by<select id="owner">'+['Bashar','kiley','Sary'].map(n=>'<option '+(state.owner===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div><label style="margin-top:12px">Scope / exclusions<textarea id="notes" rows="3" maxlength="4000">'+esc(state.notes)+'</textarea></label></details><details class="optional owner-settings"><summary>Owner settings</summary><p class="hint">Set your costs once. These starter values are illustrative and are not verified local market prices. Changes save on this device.</p><div class="grid">'+num('crew','Crew size · includes owners',1,100,1)+num('pay','Pay per person / hour · $',1,1000)+num('burden','Labor burden · %',0,100)+num('supplies','Supplies · total $',0)+num('equipment','Equipment · total $',0)+num('mileage','Vehicle cost / mile · $',0,100)+num('overhead','Overhead · %',0,100)+num('contingency','Cost reserve · %',0,100)+num('minimum','Minimum job price · $',1)+num('roughSpeed','Rough · sq ft / person-hour',1,10000)+num('finalSpeed','Final · sq ft / person-hour',1,10000)+num('touchSpeed','Touch-up · sq ft / person-hour',1,10000)+num('windowMinutes','Minutes / window unit',1,600)+num('baseRate','Final-clean benchmark · $ / sq ft',0,100)+num('lowMargin','Minimum margin · %',0,90)+num('midMargin','Recommended margin · %',0,90)+num('highMargin','Premium margin · %',0,90)+num('competitor','Comparable competitor quote · $',0)+'</div><p class="hint">Other phase benchmarks scale with their configured productivity. Include owner labor. Margin is profit divided by price.</p></details></form><aside class="quote-side"><section class="price-panel"><div class="eyebrow">Your estimate</div><div id="results" aria-live="polite"></div><button id="print" class="primary-action">Print / save customer PDF ↗</button><div class="actions"><button id="save" class="secondary">Save quote</button><button id="export" class="secondary">Export backup</button></div><p id="status" class="hint" role="status"></p><p class="device-note">Saved on this device. Estimates do not sync between owners.</p></section><details class="panel saved-panel"><summary>Saved estimates <span class="saved-count">'+saved.length+'</span></summary><div id="saved"></div></details><p class="simple-note">A starting estimate, before applicable taxes. Confirm the condition and scope before committing to a fixed price. Heavy debris, hazardous materials and specialist work require separate pricing.</p></aside></div><footer>Magnolia Construction Cleaning LLC · Olive Branch & surroundings<br>(662) 318-4046</footer>';
 $('condition').value=String(state.condition);
 document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>chooseClean(b.dataset.kind));
 $('quoteForm').onsubmit=e=>e.preventDefault();
 $('quoteForm').addEventListener('input',e=>{const t=e.target;if(!(t.id in defaults))return;state[t.id]=typeof defaults[t.id]==='number'?Number(t.value):t.value;update();if(valid())persist()});
 $('save').onclick=save;$('print').onclick=printQuote;$('export').onclick=exportBackup;update();renderSaved();
}
function update(){
 if(!valid()){$('results').innerHTML='<div class="notice">Enter a valid square footage. In settings, allow a visit for each selected phase and keep margins in increasing order.</div>';['save','print','export'].forEach(k=>$(k).disabled=true);return}
 ['save','print','export'].forEach(k=>$(k).disabled=false);
 const r=calculate(state),p=r.prices[state.choice];
 $('results').innerHTML='<p class="scope-line">'+esc(cleanName())+' · '+state.sqft.toLocaleString()+' sq ft</p><div class="hero-price">'+money(p)+'</div><p class="price-caption">'+['Competitive option','Recommended price','Premium option'][state.choice]+' · $'+(p/state.sqft).toFixed(2)+'/sq ft</p><div class="included"><span>✓ '+state.visits+' site visit'+(state.visits===1?'':'s')+'</span><span>✓ Labor & supplies included</span></div>'+(state.condition>=1.5?'<div class="notice">Heavy conditions: confirm with a walkthrough before sending a fixed price.</div>':'')+'<details class="optional"><summary>See other price options</summary><div class="options">'+r.prices.map((v,i)=>'<button type="button" class="option" data-choice="'+i+'" aria-pressed="'+(state.choice===i)+'"><span>'+['Competitive','Recommended','Premium'][i]+'</span><strong>'+money(v)+'</strong></button>').join('')+'</div></details><details class="optional"><summary>Profit & cost breakdown</summary><div class="metrics"><div class="metric"><small>Est. profit</small><strong>'+money(p-r.cost)+'</strong></div><div class="metric"><small>Est. margin</small><strong>'+((p-r.cost)/p*100).toFixed(0)+'%</strong></div><div class="metric"><small>Person-hours</small><strong>'+r.hours.toFixed(1)+'</strong></div></div><table class="breakdown"><tr><td>Labor, including travel</td><td>'+money(r.labor)+'</td></tr><tr><td>Vehicle travel</td><td>'+money(r.travel)+'</td></tr><tr><td>Supplies & equipment</td><td>'+money(state.supplies+state.equipment)+'</td></tr><tr><td>Reserve & overhead</td><td>'+money(r.reserve+r.overhead)+'</td></tr><tr><td>Total estimated costs</td><td>'+money(r.cost)+'</td></tr></table><p class="hint">Protected minimum: '+money(r.prices[0])+'. Maximum discount from this price: '+money(Math.max(0,p-r.prices[0]))+'.</p>'+(state.competitor>0?'<p class="hint">Comparable quote: '+money(state.competitor)+'. '+(state.competitor<r.prices[0]?'Below your protected minimum.':'Confirm it includes the same scope.')+'</p>':'')+'</details>';
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.choice=Number(b.dataset.choice);update();persist()});
}
function save(){if(!valid())return;const record={id:crypto.randomUUID(),date:day(),inputs:{...state},result:calculate(state)};saved.unshift(record);if(persist()){$('status').textContent='Saved on this device. No cloud sync.';renderSaved()}else{saved.shift()}}
function renderSaved(){$('saved').innerHTML=saved.length?saved.map((q,i)=>'<div class="saved"><div><strong>'+esc(q.inputs.client||'Untitled estimate')+'</strong><br><small>'+esc(q.date)+' · '+money(q.result.prices[q.inputs.choice])+'</small></div><button class="secondary" data-load="'+i+'">Open</button></div>').join(''):'<p class="hint">No saved estimates yet.</p>';document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{state={...defaults,...saved[Number(b.dataset.load)].inputs};render();$('status').textContent='Snapshot opened. Saving creates a new version.'})}
function printQuote(){if(!valid())return;const r=calculate(state);$('printout').innerHTML='<div class="eyebrow">Magnolia Construction Cleaning LLC</div><h1>Cleaning estimate</h1><p>Olive Branch & surroundings · (662) 318-4046<br>Prepared '+esc(day())+' by '+esc(state.owner)+'</p><h2>'+esc(state.client||'Client estimate')+'</h2><p>'+esc(state.project)+'</p><p>Area: '+state.sqft.toLocaleString()+' sq ft<br>Phases: '+[state.rough?'Rough clean':'',state.final?'Final clean':'',state.touch?'Touch-up':''].filter(Boolean).join(', ')+'<br>Site visits: '+state.visits+'<br>Window units (both sides): '+state.windows+'</p><h3>Scope & notes</h3><p>'+esc(state.notes||'Detailed scope to be confirmed at walkthrough.')+'</p><p class="total">Estimated price: '+money(r.prices[state.choice])+'</p><p>Before any applicable taxes. Estimate subject to confirmed scope, site condition, access and scheduling. Additional work requires agreement before proceeding. Hazardous materials, hauling and specialist work excluded unless separately agreed. This estimate is not a signed service agreement.</p>';window.print()}
function exportBackup(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),draft:state,saved},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='magnolia-estimates-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);$('status').textContent='Backup download requested. Keep the file somewhere safe.'}
(async()=>{try{await window.claude.use('db');try{const raw=localStorage.getItem(key);if(raw){const p=JSON.parse(raw);if(!Array.isArray(p.saved)||!p.draft)throw new Error('Invalid saved estimates');state={...defaults,...p.draft};saved=p.saved;}}catch(e){storageOK=false;throw new Error('Saved estimates could not be loaded. Existing browser data has been preserved. '+e.message)}render()}catch(e){$('view').innerHTML='<section class="panel"><h1>Unable to open Quote Studio</h1><p>'+esc(e.message)+'</p><a href="/">Open sales workspace</a></section>'}})();
</script></body></html>
