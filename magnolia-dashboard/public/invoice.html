<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Magnolia | Invoice Studio</title><style>

-size:12px;font-weight:700}.badge.paid{background:#e2eee4}details{border-top:1px solid var(--line);padding-top:15px;margin-top:10px}summary{cursor:pointer;font-weight:650;margin-bottom:12px}.notice{padding:12px;background:#f5edd9;border-radius:8px;font-size:13px}.saved-item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.saved-item small{display:block}.saved-item button{padding:9px 13px}.login{max-width:440px;margin:50px auto}.login label{margin:20px 0}#message{min-height:25px;font-size:13px;margin-top:16px}dialog{width:min(880px,96vw);max-height:94vh;padding:0;border:0;border-radius:15px;color:var(--green)}dialog::backdrop{background:#11291fe0}.tools{padding:18px;background:#f1f3ed;position:sticky;top:0}.tools p{font-size:12px;margin:10px 0 0}.sheet{padding:40px;background:white;font:12px/1.6 Arial;color:#193d2e}.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:20px}.sheet-header img{width:260px;max-width:65%;height:auto}.sheet-header h2{text-align:right;font:28px Georgia}.contact{padding:15px 0;border-bottom:1px solid #af9255;font-size:10px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}.meta h3{font-size:17px;margin:4px 0}.meta p{margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}.meta small{font-size:9px;letter-spacing:1px}table{border-collapse:collapse;width:100%;margin:25px 0}th{background:#193d2e;color:white;text-align:left;padding:12px}td{padding:18px 12px;border-bottom:1px solid #d7dfd7;white-space:pre-wrap;overflow-wrap:anywhere}td:last-child,th:last-child{text-align:right;width:120px}.totals{margin-left:auto;width:270px;max-width:100%}.balance{background:#eaf0e9;padding:18px;display:flex;justify-content:space-between;gap:15px;margin-top:12px;font-weight:bold}.notes{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:25px}.sheet-footer{margin-top:40px;border-top:1px solid #af9255;padding-top:15px;font-size:10px}.ref{fon </style></head><body><header><div><strong>MAGNOLIA</strong><br><small style="color:#d1ddce">OWNER TOOLS / INVOICE STUDIO</small></div><nav><a href="/">Sales workspace</a><a href="/quote.html">Quote Studio</a></nav></header><main id="view"><p>Opening Invoice Studio…</p></main><dialog id="preview" aria-label="Customer invoice preview"><div class="tools"><button id="print">Save PDF / print</button> <button id="close" class="secondary">Back to editing</button><p>On iPhone, open the print preview and use Share to save or send the PDF. Nothing is sent automatically.</p></div><section id="printout"></section></dialog><script src="/adapter.js"></script><script>
'use strict';
const KEY='magnolia-invoices-v1', $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')}
function fresh(){return {id:crypto.randomUUID(),ref:'MAG-'+today().replaceAll('-','')+'-'+crypto.randomUUID().slice(0,6).toUpperCase(),client:'',address:'',service:'Rough cleaning',serviceDate:today(),issued:today(),amount:'',payment:'unpaid',received:'',due:'',email:'',notes:''}}
let draft=fresh(),saved=[],storageOK=true;
function totals(d){const total=Math.round(Number(d.amount)*100);const paid=d.payment==='paid'?total:d.payment==='partial'?Math.round(Number(d.received)*100):0;return {total,paid,balance:total-paid}}
function msg(s){$('message').textContent=s}
function field(id,label,type='text',extra=''){return '<label>'+label+'<input id="'+id+'" type="'+type+'" value="'+esc(draft[id])+'" '+extra+'></label>'}
function render(){
$('view').innerHTML='<div class="intro"><span class="eyebrow">A CLEAN FINISH, ON PAPER</span><h1>Invoice Studio</h1><p class="muted">A few details. A polished invoice. Ready to share.</p></div><div class="layout"><form id="invoiceForm" class="panel fields"><h2>1. The job</h2>'+field('client','Customer / company','text','required maxlength="180" autocomplete="organization"')+field('address','Job address','text','required maxlength="300" autocomplete="street-address"')+'<label>Cleaning service<select id="service">'+['Rough cleaning','Final construction cleaning','Post-construction cleaning','Residential cleaning','Commercial cleaning','Junk removal','Other service'].map(v=>'<option '+(v===draft.service?'selected':'')+'>'+v+'</option>').join('')+'</select></label><div class="row">'+field('serviceDate','Service date','date','required')+field('amount','Agreed total ($)','number','required min="0.01" max="9999999.99" step="0.01" inputmode="decimal"')+'</div><h2 style="margin-top:12px">2. Payment</h2><label>Payment status<select id="payment"><option value="unpaid">Unpaid / pending</option><option value="partial">Partially paid</option><option value="paid">Paid in full</option></select></label><div id="partialField">'+field('received','Amount actually received ($)','number','min="0.01" step="0.01" inputmode="decimal"')+'</div><small>Choose paid only after payment has been received.</small><details><summary>Optional details</summary><div class="fields">'+field('email','Customer email','email','maxlength="254"')+field('due','Agreed due date','date')+field('issued','Invoice date','date','required')+field('ref','Invoice number','text','required maxlength="60"')+'<label>Scope / payment instructions<textarea id="notes" maxlength="3000">'+esc(draft.notes)+'</textarea></label><small>Use the agreed total, including any applicable tax. No tax, fee, or payment deadline is added automatically.</small></div></details><button type="submit">Preview invoice →</button></form><div><section class="panel"><span class="eyebrow">CUSTOMER BALANCE</span><div class="hero-price" id="balance"></div><span class="badge" id="badge"></span><div class="summary"><span>Invoice total</span><strong id="total"></strong></div><div class="summary"><span>Payments received</span><strong id="paid"></strong></div><div class="actions"><button type="button" id="save">Save invoice</button><button type="button" class="secondary" id="emailDraft">Prepare email</button></div><p class="muted" style="font-size:12px;margin-top:15px">Email opens in your mail app. Save the PDF and attach it before sending.</p><div id="message" role="status"></div></section><section class="panel" style="margin-top:20px"><h2>Your invoices</h2><p class="muted" style="font-size:13px">Saved on this device only. Download PDFs for your records; invoices do not sync between phones.</p><div id="saved"></div><div class="actions"><button id="new" class="secondary">+ New invoice</button></div></section></div></div>';
$('payment').value=draft.payment;
for(const id of Object.keys(draft)){const e=$(id);if(e)e.addEventListener('input',()=>{draft[id]=e.value;update()})}
$('invoiceForm').onsubmit=e=>{e.preventDefault();if(valid()){documentSheet();$('preview').showModal()}};
$('save').onclick=save;$('new').onclick=()=>{if(confirm('Start a new invoice? Save this one first if you want to keep it.')){draft=fresh();render()}};
$('emailDraft').onclick=()=>{if(!valid())return;const t=totals(draft),body='Hi,\n\nPlease find attached the '+money(t.total)+' invoice for '+draft.service.toLowerCase()+' at '+draft.address+', dated '+draft.serviceDate+'.\n\n'+(t.balance>0?'The remaining balance is '+money(t.balance)+'. Please let us know when we can expect payment.':'Payment has been received in full. Thank you!')+'\n\nThank you for your business!\n\nBashar & Kiley\nMagnolia Construction Cleaning LLC\n(662) 300-8233';location.href='mailto:'+encodeURIComponent(draft.email)+'?subject='+encodeURIComponent('Magnolia Invoice '+draft.ref+' - '+draft.address)+'&body='+encodeURIComponent(body);msg('Attach the saved PDF in your mail app before sending.');};
renderSaved();update();if(!storageOK)msg('Device storage is unavailable. You can still preview and save a PDF.');
}
function update(){const p=draft.payment==='partial';$('partialField').hidden=!p;$('received').required=p;$('received').disabled=!p;const t=totals(draft);$('total').textContent=money(Number.isFinite(t.total)?t.total:0);$('paid').textContent=money(Number.isFinite(t.paid)?t.paid:0);$('balance').textContent=money(Number.isFinite(t.balance)?t.balance:0);$('badge').textContent=draft.payment==='paid'?'PAID IN FULL':p?'PARTIALLY PAID':'PAYMENT PENDING';$('badge').classList.toggle('paid',draft.payment==='paid')}
function valid(){if(!$('invoiceForm').reportValidity())return false;const t=totals(draft);if(!draft.client.trim()||!draft.address.trim()||!draft.ref.trim()){msg('Please enter the customer, address and invoice number.');return false}if(!Number.isFinite(t.total)||t.total<=0||!Number.isFinite(t.paid)||t.paid<0||t.paid>t.total||(draft.payment==='partial'&&(t.paid<=0||t.paid>=t.total))){msg('Enter a valid total. A partial payment must be more than $0 and less than the total.');return false}if(saved.some(x=>x.id!==draft.id&&x.ref.toLowerCase()===draft.ref.trim().toLowerCase())){msg('That invoice number is already in use. Please choose a different number.');return false}return true}
function save(){if(!valid())return;const next=saved.filter(x=>x.id!==draft.id);next.unshift({...draft});try{if(!storageOK)throw Error();localStorage.setItem(KEY,JSON.stringify(next));saved=next;renderSaved();msg('Saved on this device.')}catch{msg('Could not save. Your previous invoices are unchanged. Save a PDF instead.')}}
function renderSaved(){$('saved').innerHTML=saved.length?saved.map((x,i)=>'<div class="saved-item"><div><strong>'+esc(x.client)+'</strong><small>'+esc(x.ref)+' · '+money(totals(x).balance)+' due</small></div><button class="secondary" data-open="'+i+'">Open</button></div>').join(''):'<p class="muted">Your saved invoices will appear here.</p>';$('saved').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{draft={...saved[Number(b.dataset.open)]};render()})}
