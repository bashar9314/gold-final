<title>Magnolia | Sales Workspace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* Layout: sticky brand header + tab bar, one working view below, lead record slides in from the right.

   Palette follows the Magnolia logo: forest, ivory, gold; stage colors are separate semantic hues. */

:root {

  --bg: #F5F2E6; --surface: #FCFBF5; --surface-2: #EFEBDB; --ink: #1D2A23; --muted: #67706A; --line: #DDD8C4;

  --forest: #1F3A2E; --on-forest: #F7F4E8; --gold: #A8864E; --gold-ink: #7B5F2E;

  --ok: #2F7A4F; --warn: #A8680E; --bad: #B23A2E; --shadow: 0 18px 50px -18px rgba(19,42,32,.35);

  --s-new: #6B7280; --s-reach: #B7791F; --s-talking: #2B7A78; --s-walk: #7A5CA8; --s-quote: #A8864E; --s-won: #2F7A4F; --s-lost: #A24B45;

  --display: "Cormorant Garamond", Georgia, serif; --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --bg: #0F1B15; --surface: #16261E; --surface-2: #1D3227; --ink: #ECE9DA; --muted: #9AA69E; --line: #2A4034;

  --forest: #C9A96A; --on-forest: #132A20; --gold: #C9A96A; --gold-ink: #D7BC86;

  --ok: #5FBF86; --warn: #E0A64A; --bad: #E7776B; --shadow: 0 18px 50px -18px rgba(0,0,0,.7);

  --s-new: #9AA3AF; --s-reach: #E0A64A; --s-talking: #56BDB9; --s-walk: #B39BE0; --s-quote: #D7BC86; --s-won: #5FBF86; --s-lost: #E08A83; color-scheme: dark; } }

:root[data-theme="dark"] {

  --bg: #0F1B15; --surface: #16261E; --surface-2: #1D3227; --ink: #ECE9DA; --muted: #9AA69E; --line: #2A4034;

  --forest: #C9A96A; --on-forest: #132A20; --gold: #C9A96A; --gold-ink: #D7BC86;

  --ok: #5FBF86; --warn: #E0A64A; --bad: #E7776B; --shadow: 0 18px 50px -18px rgba(0,0,0,.7);

  --s-new: #9AA3AF; --s-reach: #E0A64A; --s-talking: #56BDB9; --s-walk: #B39BE0; --s-quote: #D7BC86; --s-won: #5FBF86; --s-lost: #E08A83; color-scheme: dark; }

* { box-sizing: border-box; }

body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); padding-inline: 16px; padding-block: 0 48px; }

button, input, select, textarea { font: inherit; color: inherit; }

button { cursor: pointer; }

a { color: var(--gold-ink); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 1400px; margin: 0 auto; }

/* header */

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); }

.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }

.brand { display: flex; align-items: baseline; gap: 10px; }

.brand b { font: 600 26px/1 var(--display); letter-spacing: .08em; color: var(--forest); }

.brand span { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-ink); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }

.tabs::-webkit-scrollbar { display: none; }

.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--muted); font-weight: 500; white-space: nowrap; min-height: 44px; }

.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }

.tab .n { margin-left: 6px; font-size: 11px; background: var(--surface-2); color: var(--muted); padding: 1px 7px; border-radius: 10px; }

.tab .n.hot { background: var(--bad); color: #fff; }

/* buttons */

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 4px; min-height: 40px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }

.btn:hover { border-color: var(--gold); }

.btn.primary { background: var(--forest); color: var(--on-forest); border-color: var(--forest); }

.btn.primary:hover { filter: brightness(1.12); }

.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 12.5px; }

.btn.ghost { background: none; }

.btn.danger { color: var(--bad); }

.btn:disabled { opacity: .5; cursor: not-allowed; }

main { padding-block: 22px; }

h2.sec { font: 600 22px/1.2 var(--display); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }

h2.sec .n { font: 500 12px var(--ui); color: var(--muted); }

.lede { color: var(--muted); margin: 0 0 18px; max-width: 62ch; }

/* stat strip */

.stats { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; margin-bottom: 26px; }

.stat { flex: 1 1 130px; padding: 12px 16px; border-right: 1px solid var(--line); min-width: 0; }

.stat:last-child { border-right: 0; }

.stat b { display: block; font: 600 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }

.stat span { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }

.stat.hot b { color: var(--bad); }

/* rows */

.list { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }

.row { display: grid; grid-template-columns: minmax(0, 2.2fr) 130px 120px minmax(0, 1.4fr) auto; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }

.row:last-child { border-bottom: 0; }

.row:hover { background: var(--surface-2); }

.who { min-width: 0; }

.who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.who small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.last { color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.quick { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

.owner-av { width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; object-fit: cover; }

.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 10px; white-space: nowrap; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 30%, transparent); }

.due { font-size: 12px; font-weight: 600; white-space: nowrap; }

.due.bad { color: var(--bad); } .due.warn { color: var(--warn); } .due.ok { color: var(--muted); font-weight: 500; }

.empty { border: 1px dashed var(--line); padding: 34px 20px; text-align: center; color: var(--muted); border-radius: 4px; background: var(--surface); }

.empty h3 { font: 600 24px var(--display); color: var(--ink); margin: 0 0 6px; }

.empty .btn { margin: 6px 4px 0; }

.section { margin-bottom: 30px; }

/* kanban */

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: start; }

.col { background: var(--surface-2); border-radius: 4px; padding: 10px; min-height: 140px; border-top: 3px solid var(--c); }

.col.over { outline: 2px dashed var(--gold); }

.col h3 { margin: 0 0 10px; font: 600 12px var(--ui); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: block; }

.card:hover { border-color: var(--gold); }

.card b { display: block; overflow-wrap: anywhere; }

.card small { color: var(--muted); display: block; }

.card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 6px; }

/* filters */

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

.filters input, .filters select, .field { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 10px; min-height: 40px; min-width: 0; }

.filters input[type=search] { flex: 1 1 220px; }

/* drawer & modal */

.scrim { position: fixed; inset: 0; background: rgba(8,16,12,.5); z-index: 40; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); animation: slide .22s ease-out; }

@keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.drawer-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }

.drawer-head h2 { font: 600 26px/1.15 var(--display); margin: 0; overflow-wrap: anywhere; }

.drawer-body { overflow-y: auto; padding: 16px 18px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }

.x { margin-left: auto; background: none; border: 0; font-size: 26px; line-height: 1; min-width: 44px; min-height: 44px; color: var(--muted); }

.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 20px; border-radius: 4px; }

.modal h2 { font: 600 26px var(--display); margin: 0 0 12px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }

label.f input, label.f select, label.f textarea { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0; }

label.f textarea { resize: vertical; min-height: 84px; }

.bl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.kv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.kv .val { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.subh { font: 600 11.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); margin: 0 0 8px; }

.logbtns { display: flex; gap: 6px; flex-wrap: wrap; }

.panel { border: 1px solid var(--line); background: var(--surface); padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

.tl li { padding-left: 14px; border-left: 2px solid var(--line); position: relative; }

.tl li small { color: var(--muted); }

.tl li p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.tl .del { background: none; border: 0; color: var(--muted); float: right; font-size: 16px; min-width: 32px; min-height: 28px; }

.preview { white-space: pre-wrap; background: var(--surface-2); padding: 10px 12px; border-radius: 4px; font-size: 13px; max-height: 260px; overflow-y: auto; overflow-wrap: anywhere; }

.people { display: flex; flex-direction: column; gap: 4px; }

.person { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); padding: 6px 8px; text-align: left; border-radius: 4px; }

.person img { width: 24px; height: 24px; border-radius: 50%; }

.tpl { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

.tpl textarea { min-height: 150px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--forest); color: var(--on-forest); padding: 10px 16px; border-radius: 4px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

.banner { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); padding: 8px 12px; border-radius: 4px; margin-bottom: 14px; }

.hint { color: var(--muted); font-size: 12.5px; }

code.mf { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }

@media (max-width: 860px) {

  .row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }

  .row .last { grid-column: 1 / -1; order: 5; white-space: normal; }

  .row .quick { grid-column: 1 / -1; order: 6; justify-content: flex-start; }

  .row .stagecell { order: 2; } .row .duecell { order: 3; }

  .brand span { display: none; }

}

@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } .stat { flex-basis: 45%; } .stat:nth-child(2) { border-right: 0; } .stat { border-bottom: 1px solid var(--line); } }

@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }

/* Refined workspace */

:root { color-scheme: light; --bg:#f4f5f1; --surface:#fffef9; --surface-2:#eef1e9; --line:#dde3d9; --ink:#20362b; --muted:#6b776e; --forest:#1f3a2e; --gold:#ab8b55; }

body {padding:0 32px 32px;background:var(--bg)}

.wrap {max-width:1500px}.top {padding:24px 0 0;background:var(--bg)}

.brand {align-items:center;gap:14px}.brand b {font-size:27px;letter-spacing:.13em}.brand span {display:block;font-size:9px;letter-spacing:.16em;margin-top:7px}

.brand-mark {display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#1f3a2e;color:#d2b980;font:30px Georgia;border:1px solid #a8864e}

.tabs {margin-top:24px;gap:12px}.tab {padding:12px 18px;font-size:13px}.tab[aria-selected="true"] {background:var(--surface);border-radius:9px 9px 0 0;color:var(--forest)}

.btn {border-radius:9px;min-height:42px}.btn.primary {box-shadow:0 3px 7px #1f3a2e12}.btn.sm{border-radius:7px}

.workspace-meta {display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--muted);padding:18px 0 0}.dot {margin:0 8px}#syncStatus {text-align:right}

function parseCSV(text) {

  var rows = [], row = [], f = '', q = false, i = 0, c;

  text = text.replace(/^﻿/, '');

  while (i < text.length) {

    c = text[i];

    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }

    else if (c === '"') q = true;

    else if (c === ',') { row.push(f); f = ''; }

    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }

    else f += c;

    i++;

  }

  if (f.length || row.length) { row.push(f); rows.push(row); }

  return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });

}

        });

}
