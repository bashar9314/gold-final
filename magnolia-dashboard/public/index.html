<style>

/* Layout: sticky brand header + tab bar, one working view below, lead record slides in from the right.

   Palette follows the Magnolia logo: forest, ivory, gold; stage colors are separate semantic hues. */

:root {

  --bg: #F5F2E6; --surface: #FCFBF5; --surface-2: #EFEBDB; --ink: #1D2A23; --muted: #67706A; --line: #DDD8C4;

  --forest: #1F3A2E; --on-forest: #F7F4E8; --gold: #A8864E; --gold-ink: #7B5F2E;

  --ok: #2F7A4F; --warn: #A8680E; --bad: #B23A2E; --shadow: 0 18px 50px -18px rgba(19,42,32,.35);

  --s-new: #6B7280; --s-reach: #B7791F; --s-talking: #2B7A78; --s-walk: #7A5CA8; --s-quote: #A8864E; --s-won: #2F7A4F; --s-lost: #A24B45;

  --display: "Cormorant Garamond", Georgia, serif; --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --bg: #0F1B15; --surface: #16261E; --surface-2: #1D3227; --ink: #ECE9DA; --muted: #9AA69E; --line: #2A4034;

  --forest: #C9A96A; --on-forest: #132A20; --gold: #C9A96A; --gold-ink: #D7BC86;

  --ok: #5FBF86; --warn: #E0A64A; --bad: #E7776B; --shadow: 0 18px 50px -18px rgba(0,0,0,.7);

  --s-new: #9AA3AF; --s-reach: #E0A64A; --s-talking: #56BDB9; --s-walk: #B39BE0; --s-quote: #D7BC86; --s-won: #5FBF86; --s-lost: #E08A83; color-scheme: dark; } }

:root[data-theme="dark"] {

  --bg: #0F1B15; --surface: #16261E; --surface-2: #1D3227; --ink: #ECE9DA; --muted: #9AA69E; --line: #2A4034;

  --forest: #C9A96A; --on-forest: #132A20; --gold: #C9A96A; --gold-ink: #D7BC86;

  --ok: #5FBF86; --warn: #E0A64A; --bad: #E7776B; --shadow: 0 18px 50px -18px rgba(0,0,0,.7);

  --s-new: #9AA3AF; --s-reach: #E0A64A; --s-talking: #56BDB9; --s-walk: #B39BE0; --s-quote: #D7BC86; --s-won: #5FBF86; --s-lost: #E08A83; color-scheme: dark; }

* { box-sizing: border-box; }

body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui); padding-inline: 16px; padding-block: 0 48px; }

button, input, select, textarea { font: inherit; color: inherit; }

button { cursor: pointer; }

a { color: var(--gold-ink); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap { max-width: 1400px; margin: 0 auto; }

/* header */

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 0; border-bottom: 1px solid var(--line); }

.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }

.brand { display: flex; align-items: baseline; gap: 10px; }

.brand b { font: 600 26px/1 var(--display); letter-spacing: .08em; color: var(--forest); }

.brand span { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold-ink); }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }

.tabs::-webkit-scrollbar { display: none; }

.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; color: var(--muted); font-weight: 500; white-space: nowrap; min-height: 44px; }

.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }

.tab .n { margin-left: 6px; font-size: 11px; background: var(--surface-2); color: var(--muted); padding: 1px 7px; border-radius: 10px; }

.tab .n.hot { background: var(--bad); color: #fff; }

/* buttons */

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 4px; min-height: 40px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }

.btn:hover { border-color: var(--gold); }

.btn.primary { background: var(--forest); color: var(--on-forest); border-color: var(--forest); }

.btn.primary:hover { filter: brightness(1.12); }

.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 12.5px; }

.btn.ghost { background: none; }

.btn.danger { color: var(--bad); }

.btn:disabled { opacity: .5; cursor: not-allowed; }

main { padding-block: 22px; }

h2.sec { font: 600 22px/1.2 var(--display); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }

h2.sec .n { font: 500 12px var(--ui); color: var(--muted); }

.lede { color: var(--muted); margin: 0 0 18px; max-width: 62ch; }

/* stat strip */

.stats { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; margin-bottom: 26px; }

.stat { flex: 1 1 130px; padding: 12px 16px; border-right: 1px solid var(--line); min-width: 0; }

.stat:last-child { border-right: 0; }

.stat b { display: block; font: 600 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }

.stat span { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }

.stat.hot b { color: var(--bad); }

/* rows */

.list { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }

.row { display: grid; grid-template-columns: minmax(0, 2.2fr) 130px 120px minmax(0, 1.4fr) auto; gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }

.row:last-child { border-bottom: 0; }

.row:hover { background: var(--surface-2); }

.who { min-width: 0; }

.who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.who small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.last { color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.quick { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

.owner-av { width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; object-fit: cover; }

.chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 10px; white-space: nowrap; color: var(--c, var(--muted)); background: color-mix(in srgb, var(--c, var(--muted)) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 30%, transparent); }

.due { font-size: 12px; font-weight: 600; white-space: nowrap; }

.due.bad { color: var(--bad); } .due.warn { color: var(--warn); } .due.ok { color: var(--muted); font-weight: 500; }

.empty { border: 1px dashed var(--line); padding: 34px 20px; text-align: center; color: var(--muted); border-radius: 4px; background: var(--surface); }

.empty h3 { font: 600 24px var(--display); color: var(--ink); margin: 0 0 6px; }

.empty .btn { margin: 6px 4px 0; }

.section { margin-bottom: 30px; }

/* kanban */

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: start; }

.col { background: var(--surface-2); border-radius: 4px; padding: 10px; min-height: 140px; border-top: 3px solid var(--c); }

.col.over { outline: 2px dashed var(--gold); }

.col h3 { margin: 0 0 10px; font: 600 12px var(--ui); letter-spacing: .12em; text-transform: uppercase; display: flex; justify-content: space-between; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; display: block; }

.card:hover { border-color: var(--gold); }

.card b { display: block; overflow-wrap: anywhere; }

.card small { color: var(--muted); display: block; }

.card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 6px; }

/* filters */

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

.filters input, .filters select, .field { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 10px; min-height: 40px; min-width: 0; }

.filters input[type=search] { flex: 1 1 220px; }

/* drawer & modal */

.scrim { position: fixed; inset: 0; background: rgba(8,16,12,.5); z-index: 40; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); animation: slide .22s ease-out; }

@keyframes slide { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

.drawer-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }

.drawer-head h2 { font: 600 26px/1.15 var(--display); margin: 0; overflow-wrap: anywhere; }

.drawer-body { overflow-y: auto; padding: 16px 18px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }

.x { margin-left: auto; background: none; border: 0; font-size: 26px; line-height: 1; min-width: 44px; min-height: 44px; color: var(--muted); }

.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow-y: auto; background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 20px; border-radius: 4px; }

.modal h2 { font: 600 26px var(--display); margin: 0 0 12px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }

label.f input, label.f select, label.f textarea { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0; }

label.f textarea { resize: vertical; min-height: 84px; }

.bl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.kv { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.kv .val { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.subh { font: 600 11.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-ink); margin: 0 0 8px; }

.logbtns { display: flex; gap: 6px; flex-wrap: wrap; }

.panel { border: 1px solid var(--line); background: var(--surface); padding: 12px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }

.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

.tl li { padding-left: 14px; border-left: 2px solid var(--line); position: relative; }

.tl li small { color: var(--muted); }

.tl li p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.tl .del { background: none; border: 0; color: var(--muted); float: right; font-size: 16px; min-width: 32px; min-height: 28px; }

.preview { white-space: pre-wrap; background: var(--surface-2); padding: 10px 12px; border-radius: 4px; font-size: 13px; max-height: 260px; overflow-y: auto; overflow-wrap: anywhere; }

.people { display: flex; flex-direction: column; gap: 4px; }

.person { display: flex; align-items: center; gap: 8px; background: none; border: 1px solid var(--line); padding: 6px 8px; text-align: left; border-radius: 4px; }

.person img { width: 24px; height: 24px; border-radius: 50%; }

.tpl { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

.tpl textarea { min-height: 150px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--forest); color: var(--on-forest); padding: 10px 16px; border-radius: 4px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

.banner { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); padding: 8px 12px; border-radius: 4px; margin-bottom: 14px; }

.hint { color: var(--muted); font-size: 12.5px; }

code.mf { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }

@media (max-width: 860px) {

  .row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }

  .row .last { grid-column: 1 / -1; order: 5; white-space: normal; }

  .row .quick { grid-column: 1 / -1; order: 6; justify-content: flex-start; }

  .row .stagecell { order: 2; } .row .duecell { order: 3; }

}

  lay.innerHTML = '<div class="scrim" data-act="close"></div><aside class="drawer" id="drawerEl" role="dialog" aria-modal="true" aria-label="Lead details">' + drawerHtml(l) + '</aside>';

}

function openLead(id) {

  S.openId = id; S.logging = null; S.drawerActs = [];

  if (unsubDrawer) unsubDrawer();

  unsubDrawer = db.collection('activity').where('leadId', '==', id).onSnapshot(function (snap) {

    S.drawerActs = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }).sort(function (a, b) { return a.at < b.at ? 1 : -1; });

    var tl = $('#timeline'); if (tl) tl.innerHTML = timelineHtml(); loadPeople();

  }, function (e) { console.error(e); });

  renderDrawer(true);

}

function closeDrawer() { S.openId = null; S.logging = null; if (unsubDrawer) { unsubDrawer(); unsubDrawer = null; } $('#layer').innerHTML = ''; }

/* ---------- modals ---------- */

function modalShell(inner) { $('#layer').innerHTML = '<div class="scrim" data-act="closemodal"></div><div class="modal" role="dialog" aria-modal="true">' + inner + '</div>'; }

function closeModal() { S.modal = null; if (S.openId) renderDrawer(true); else $('#layer').innerHTML = ''; }

function addLeadModal() {

  S.modal = 'add';

  modalShell('<h2>Add a lead</h2><form id="addForm"><div class="grid2">' +

    '<label class="f">Company<input id="a_company" required autofocus></label><label class="f">Contact name<input id="a_name"></label>' +

    '<label class="f">Phone<input id="a_phone" type="tel"></label><label class="f">Email<input id="a_email" type="email"></label>' +

    '<label class="f">Type<select id="a_segment"><option value="">Choose…</option>' + SEGMENTS.map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select></label>' +

    '<label class="f">Source<input id="a_source" placeholder="Referral, permit list…"></label></div>' +

    '<label class="f" style="margin-top:12px">Notes<textarea id="a_notes"></textarea></label>' +

    '<div class="bl" style="margin-top:14px"><button class="btn primary" type="submit">Add lead</button><button class="btn ghost" type="button" data-act="closemodal">Cancel</button></div></form>');

}

/* CSV */

function parseCSV(text) {

  var rows = [], row = [], f = '', q = false, i = 0, c;

  text = text.replace(/^﻿/, '');

  while (i < text.length) {

    c = text[i];

    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }

    else if (c === '"') q = true;

    else if (c === ',') { row.push(f); f = ''; }

    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }

    else f += c;

    i++;

  }

  if (f.length || row.length) { row.push(f); rows.push(row); }

  return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });

}

var HEADMAP = { company: ['company', 'business', 'organization', 'account'], name: ['name', 'contact', 'contact name', 'full name'], first: ['first name', 'firstname', 'first'], last: ['last name', 'lastname', 'last'],

  title: ['title', 'role', 'position'], phone: ['phone', 'phone number', 'mobile', 'cell', 'telephone'], email: ['email', 'e-mail', 'email address'], website: ['website', 'url', 'web site', 'site'], segment: ['type', 'segment', 'category'], sourceType:['sourcetype'], discoveryDay:['discoveryday'], sourceCalled:['sourcecalled'], priority:['priority'], area:['area'], verification:['verification'], source: ['source'], notes: ['notes', 'note', 'comments'], stage:['stage','status'], followUp:['followup','follow up','follow-up'], lastContact:['lastcontact','last contact'] };

function csvToLeads(text) {

  var rows = parseCSV(text); if (rows.length < 2) return { leads: [], cols: [] };

  var heads = rows[0].map(function (h) { return h.trim().toLowerCase(); }), idx = {};

  Object.keys(HEADMAP).forEach(function (k) { heads.forEach(function (h, i) { if (idx[k] == null && HEADMAP[k].indexOf(h) >= 0) idx[k] = i; }); });

  var get = function (r, k) { return idx[k] == null ? '' : (r[idx[k]] || '').trim(); };

  var leads = rows.slice(1).map(function (r) {

    var nm = get(r, 'name') || [get(r, 'first'), get(r, 'last')].filter(Boolean).join(' ');

    var seg = get(r, 'segment'); seg = SEGMENTS.filter(function (s) { return s.toLowerCase() === seg.toLowerCase(); })[0] || seg;

    return { sourceType:get(r,'sourceType'), discoveryDay:get(r,'discoveryDay'), sourceCalled: /^(true|yes|1)$/i.test(get(r,'sourceCalled')), priority:get(r,'priority'), area:get(r,'area'), verification:get(r,'verification'), company: get(r, 'company'), name: nm, title: get(r, 'title'), phone: get(r, 'phone'), email: get(r, 'email'), website: get(r, 'website'), segment: seg, source: get(r, 'source'), notes: get(r, 'notes'), stage: (STAGES.find(function(x){return x.id === get(r,'stage').toLowerCase() || x.label.toLowerCase() === get(r,'stage').toLowerCase();}) || STAGES[0]).id, followUp: /^\d{4}-\d{2}-\d{2}$/.test(get(r,'followUp')) ? get(r,'followUp') : '', lastContact: get(r,'lastContact') && !isNaN(Date.parse(get(r,'lastContact'))) ? new Date(get(r,'lastContact')).toISOString() : '' };

  }).filter(function (l) { return l.company || l.name || l.phone || l.email; });

  return { leads: leads, cols: Object.keys(idx) };

}

var importBuf = [];

function importModal() {

  S.modal = 'import'; importBuf = [];

  modalShell('<h2>Import leads</h2><p class="hint" style="margin-top:0">Upload a CSV (export from Excel or Google Sheets). Imports company, contact, phone, email, type, stage, follow-up date and notes. Exported pipeline CSV files preserve stage and follow-up dates. Rows with the same company name are skipped. Shared office phone numbers are kept for separate companies.</p>' +

    '<label class="f">CSV file<input type="file" id="csvFile" accept=".csv,text/csv"></label><p id="importInfo" class="hint"></p>' +

    '<div class="bl"><button class="btn primary" id="doImport" data-act="doimport" disabled>Import</button><button class="btn ghost" data-act="closemodal">Cancel</button></div>');

}

/* ---------- people ---------- */

function loadPeople() {

  if (!userCap) return;

  var ids = {}; S.leads.forEach(function (l) { if (l.owner) ids[l.owner] = 1; }); S.acts.concat(S.drawerActs).forEach(function (a) { if (a.by) ids[a.by] = 1; }); if (S.myId) ids[S.myId] = 1;

  var list = Object.keys(ids).sort(), key = list.join(',');

  if (!list.length || key === S.peopleKey) return;

  S.peopleKey = key;

  userCap.profiles(list).then(function (p) { S.people = Object.assign({}, S.people, p); refresh(false); });

}

function ownerSearch(q){
 var box=$('#ownerList');if(!box)return;
 box.innerHTML=[['owner','Bashar'],['wife','Wife'],['','Unassigned']].filter(function(x){return x[1].toLowerCase().includes(String(q||'').toLowerCase());}).map(function(x){return '<button class="person" data-act="setowner" data-o="'+x[0]+'">'+x[1]+'</button>';}).join('');
}
function workingProfile(){try{return JSON.parse(localStorage.getItem('magnolia-working-profile'))||{id:'owner',name:'Bashar'};}catch(e){return {id:'owner',name:'Bashar'};}}
function profileModal(){closeDrawer();S.modal='profile';var p=workingProfile();modalShell('<h2>Who is working?</h2><p>Choose a work label for assignments and activity. Both labels use your existing shared workspace sign-in.</p><label class="f">Working profile<select id="workingId"><option value="owner"'+(p.id==='owner'?' selected':'')+'>Bashar</option><option value="wife"'+(p.id==='wife'?' selected':'')+'>Wife</option></select></label><label class="f">Your name for scripts<input id="workingName" maxlength="80" value="'+esc(p.name||'')+'" placeholder="Enter your first name"></label><p class="hint">This choice is remembered on this device. Enter your own name so drafts introduce the correct caller.</p><button class="btn primary" data-act="saveprofile">Use this profile</button><button class="btn" data-act="closemodal">Cancel</button>');}

/* ---------- events ---------- */

document.addEventListener('click', function (e) {

  var el = e.target.closest('[data-act]'); if (!el) return;

  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), l = id ? byId(id) : byId(S.openId);

  switch (act) {

    case 'preparecall': callDraft.channel='call';callDraft.leadId=id;callDraft.mode=l&&l.stage==='quote'?'quote':l&&(l.sourceCalled||l.lastContact)?'followup':'first';callDraft.text=null;closeDrawer();S.tab='templates';refresh(true);window.scrollTo(0,0);break;
    case 'profile': profileModal();break;
    case 'saveprofile': var pid=$('#workingId').value,pname=$('#workingName').value.trim();if(!pname){toast('Enter your name for scripts');break;}try{localStorage.setItem('magnolia-working-profile',JSON.stringify({id:pid,name:pname}));}catch(e){toast('Profile will last for this session only');}S.myId=pid;S.myName=pname;callDraft.text=null;closeModal();refresh(true);toast('Working profile updated');break;
    case 'copycall': if($('#callOutput'))copy($('#callOutput').value);break;
    case 'resetcall': regenerateCall();break;
    case 'tab': S.tab = el.getAttribute('data-t'); refresh(true); window.scrollTo(0, 0); break;

    case 'open': openLead(id); break;

    case 'close': closeDrawer(); break;

    case 'closemodal': closeModal(); break;

    case 'addlead': addLeadModal(); break;

    case 'import': importModal(); break;

    case 'copyphone': if (l) copy(l.phone); break;

    case 'copyemail': if (l) copy(l.email); break;

    case 'quicklog': if (l) { if(el.disabled)return;el.disabled=true; var t = el.getAttribute('data-t'); var fu = LOGS[t].days==null?'':addDays(LOGS[t].days); logActivity(l, t, '', fu).then(function () { toast(LOGS[t].label + ' logged. Follow up ' + fmtDay(fu) + '.'); }).catch(fail); } break;

    case 'startlog': S.logging = el.getAttribute('data-t'); renderDrawer(true); setTimeout(function () { var n = $('#logNote'); if (n) n.focus(); }, 30); break;

    case 'cancellog': S.logging = null; renderDrawer(true); break;

    case 'savelog': if (l && S.logging && !el.disabled) { var t2 = S.logging, note = ($('#logNote') || {}).value || '', f = $('#logFollow'); el.disabled=true; logActivity(l, t2, note.trim(), f ? f.value : undefined).then(function () { S.logging=null;toast(LOGS[t2].label + ' logged.'); renderDrawer(true); }).catch(function(e){el.disabled=false;fail(e);}); } break;

    case 'markemailed': if (l) { var f3 = addDays(LOGS.email.days), tp = S.templates.filter(function (x) { return x.id === ($('#etpl') || {}).value; })[0]; logActivity(l, 'email', tp ? 'Sent: ' + tp.name : '', f3).then(function () { toast('Logged as emailed. Follow up ' + fmtDay(f3) + '.'); }).catch(fail); } break;

    case 'copyemailbody': if (l) { var t4 = S.templates.filter(function (x) { return x.id === ($('#etpl') || {}).value; })[0]; if (t4) copy(mergeFields(t4.subject, l) + '\n\n' + mergeFields(t4.body, l)); } break;

    case 'copyscript': var ts = S.templates.filter(function (x) { return x.id === id; })[0]; if (ts && byId(S.openId)) copy(mergeFields(ts.body, byId(S.openId))); break;

    case 'delact': if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Delete?'; el.style.color = 'var(--bad)'; } else db.doc('activity/' + id).delete().catch(fail); break;

    case 'dellead': if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Click again to remove (kept in backup)'; } else { var lid = S.openId; closeDrawer(); db.doc('leads/' + lid).delete().then(function () { toast('Lead deleted'); }, fail); } break;

    case 'pickowner': $('#ownerPick').innerHTML = '<div class="panel" style="margin-top:8px"><input class="field" id="ownerQ" placeholder="Choose owner" aria-label="Choose owner"><div class="people" id="ownerList"></div></div>'; ownerSearch(''); $('#ownerQ').focus(); break;

    case 'setowner': saveLead(S.openId, { owner: el.getAttribute('data-o') || null }).then(function(){ $('#ownerPick').innerHTML='';renderDrawer(true);toast('Assignment saved'); }).catch(fail); break;

    case 'addtpl': var k = el.getAttribute('data-k'); db.collection('templates').add({ name: 'New template', kind: k, subject: k === 'email' ? 'Subject' : '', body: '', order: Date.now() }).catch(fail); break;

    case 'deltpl': if (!el.dataset.sure) { el.dataset.sure = 1; el.textContent = 'Click again to delete'; } else db.doc('templates/' + id).delete().catch(fail); break;

    case 'doimport': runImport(); break;

    case 'export': exportCSV(); break;

    case 'backup': window.magnoliaBackup(); break;
    case 'restore': modalShell('<h2>Merge a workspace backup</h2><p>Existing records stay intact. New leads, activity and templates from the backup are added by record ID. A cloud snapshot is preserved first.</p><label class="f">JSON backup<input type="file" id="restoreFile" accept=".json,application/json"></label><p id="restoreInfo" role="status"></p><button class="btn" data-act="closemodal">Cancel</button>'); break;
    case 'logout': window.magnoliaLogout().catch(fail); break;
    case 'installhelp': modalShell('<h2>Save Magnolia on your phone</h2><p>iPhone: open this live address in Safari, tap Share, then Add to Home Screen.</p><p>Android: open it in Chrome, tap the menu, then Add to Home screen.</p><p>Your notes save to your private workspace while connected. This app does not save changes offline.</p><button class="btn primary" data-act="closemodal">Done</button>'); break;

  }

});

document.addEventListener('change', function (e) {

  var t = e.target;

  if (t.id === 'restoreFile') { var backupFile=t.files[0];if(!backupFile)return;if(backupFile.size>2000000){fail(new Error('Backup must be smaller than 2 MB'));return;}backupFile.text().then(function(text){var parsed=JSON.parse(text);$('#restoreInfo').textContent='Merging backup…';return window.magnoliaRestore(parsed.state||parsed);}).then(function(){closeModal();toast('Backup merged. Existing records preserved.');}).catch(function(e){var info=$('#restoreInfo');if(info)info.textContent=e.message;fail(e);}); }
  else if(t.id==='callLead'){callDraft.leadId=t.value;regenerateCall();}
  else if(t.id==='workingId'){$('#workingName').value=t.value==='owner'?'Bashar':'';}
  else if(t.id==='todayOwner'){S.todayOwner=t.value;refresh(true);}
  else if(t.id==='callChannel'){callDraft.channel=t.value;regenerateCall();}
  else if(t.id==='callMode'){callDraft.mode=t.value;regenerateCall();}
  else if(t.id==='callGoal'){callDraft.goal=t.value;regenerateCall();}
  else if (t.id === 'fqueue') { S.f.queue = t.value; $('#leadList').innerHTML = leadListHtml(); }

  else if (t.id === 'fstage') { S.f.stage = t.value; $('#leadList').innerHTML = leadListHtml(); }

  else if (t.id === 'fseg') { S.f.segment = t.value; $('#leadList').innerHTML = leadListHtml(); }

  else if (t.id === 'fown') { S.f.owner = t.value; $('#leadList').innerHTML = leadListHtml(); }

  else if (t.id === 'etpl') { S.emailTpl = t.value; renderDrawer(true); }

  else if (t.id === 'gmailAcct') { try { localStorage.setItem('mgn-gmail', t.value.trim()); } catch (x) {} var l0 = byId(S.openId), tp0 = S.templates.filter(function (x) { return x.id === ($('#etpl') || {}).value; })[0]; if (l0 && tp0) $('#egmail').href = gmailUrl(l0, mergeFields(tp0.subject, l0), mergeFields(tp0.body, l0)); }

  else if (t.id === 'csvFile') { var fl = t.files[0]; if (!fl) return; var r = new FileReader(); r.onload = function () { var res = csvToLeads(String(r.result)); var have = {}; var identity = function(x){return x.company.trim().toLowerCase().replace(/[^a-z0-9]/g,'') || ('contact:'+x.email.toLowerCase()+':'+digits(x.phone));}; S.leads.forEach(function(x){have[identity(x)]=1;});

      importBuf = res.leads.filter(function (x) { var k=identity(x); if(have[k])return false;have[k]=1;return true; });

      var skipped = res.leads.length - importBuf.length;

      $('#importInfo').textContent = res.leads.length ? importBuf.length + ' new leads ready' + (skipped ? ', ' + skipped + ' skipped as duplicates' : '') + '. Columns found: ' + res.cols.join(', ') + '.' : 'No rows found. The first row must be column headings such as company, name, phone, email.';

      $('#doImport').disabled = !importBuf.length; }; r.readAsText(fl); }

  else if (t.hasAttribute('data-lf') && S.openId) { var key = t.getAttribute('data-lf'), lead = byId(S.openId); if (lead && (lead[key] || '') !== t.value) { if (key === 'stage') setStage(lead, t.value); else if (!t.checkValidity()) { t.reportValidity(); } else saveLead(S.openId, (function (o) { o[key] = t.value; return o; })({})).catch(fail); } }

  else if (t.hasAttribute('data-tf')) { var tid = t.closest('[data-tid]').getAttribute('data-tid'), tk = t.getAttribute('data-tf'), tpl = S.templates.filter(function (x) { return x.id === tid; })[0]; if (tpl && (tpl[tk] || '') !== t.value) { var p = {}; p[tk] = t.value; serial('templates/' + tid, function () { return db.doc('templates/' + tid).update(p); }).then(function () { if (tk === 'kind') refresh(true); }).catch(fail); } }

});

document.addEventListener('input', function (e) {
  if(e.target.id==='callOutput'){callDraft.text=e.target.value;return;}

  if (e.target.id === 'fq') { S.f.q = e.target.value; $('#leadList').innerHTML = leadListHtml(); }

  else if (e.target.id === 'ownerQ') ownerSearch(e.target.value);

});

document.addEventListener('submit', function (e) {

  if (e.target.id !== 'addForm') return; e.preventDefault();

  var v = function (k) { return $('#a_' + k).value.trim(); };

  var d = newLead({ company: v('company'), name: v('name'), phone: v('phone'), email: v('email'), segment: v('segment'), source: v('source'), notes: v('notes') });

  if(!d.company&&!d.name){toast('Enter a company or contact name.');return;}var submit=e.target.querySelector('[type=submit]');submit.disabled=true;
  db.collection('leads').add(d).then(function (ref) { closeModal(); toast('Lead added'); if (S.tab === 'today') S.tab = 'leads'; refresh(true); openLead(ref.id); }).catch(function(err){submit.disabled=false;fail(err);});

});

document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (S.modal) closeModal(); else if (S.openId) closeDrawer(); } });

/* drag and drop between stages */

document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('.card'); if (c) { e.dataTransfer.setData('text/plain', c.getAttribute('data-id')); e.dataTransfer.effectAllowed = 'move'; } });

document.addEventListener('dragover', function (e) { var c = e.target.closest && e.target.closest('.col'); if (c && S.canWrite) { e.preventDefault(); c.classList.add('over'); } });

document.addEventListener('dragleave', function (e) { var c = e.target.closest && e.target.closest('.col'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });

document.addEventListener('drop', function (e) {

  var c = e.target.closest && e.target.closest('.col'); if (!c) return; e.preventDefault(); c.classList.remove('over');

  var l = byId(e.dataTransfer.getData('text/plain')); if (l && S.canWrite) setStage(l, c.getAttribute('data-stage'));

});

function runImport() {

  var btn = $('#doImport'), n = importBuf.length, done = 0; btn.disabled = true;

  var next = function () {

    if (done >= n) { toast(n + ' leads imported'); closeModal(); S.tab = 'leads'; refresh(true); return; }

    btn.textContent = 'Importing ' + (done + 1) + ' of ' + n + '…';

    db.collection('leads').add(newLead(importBuf[done])).then(function () { done++; next(); }, function (e) { fail(e); btn.disabled = false; btn.textContent = 'Retry import'; importBuf = importBuf.slice(done); });

  };

  next();

}

function exportCSV() {

  if (!dl) return;

  var cols = ['sourceCalled', 'priority', 'area', 'verification', 'sourceType', 'discoveryDay', 'company', 'name', 'title', 'phone', 'email', 'website', 'segment', 'source', 'stage', 'followUp', 'lastContact', 'notes'];

  var q = function (v) { v = String(v == null ? '' : v); if (/^[=+@\-\t\r]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

  var out = cols.join(',') + '\n' + S.leads.map(function (l) { return cols.map(function (c) { return q(c === 'stage' ? stageOf(l.stage).label : l[c]); }).join(','); }).join('\n');

  dl.save({ filename: 'magnolia-leads-' + today() + '.csv', data: out }).then(function () { toast('Export saved'); }, function (e) { if (e && e.code !== 'declined') toast('Export is not available here.'); });

}

/* ---------- boot ---------- */

var snapPending = 3;

function ready() { if (--snapPending === 0) { S.ready = true; } }

var firstLeads = true, firstActs = true, firstTpl = true;

function boot() {

  renderTop(); renderView(true);

  Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]).then(function (r) {

    db = r[0]; userCap = r[1]; dl = r[2];

    if (!db) { S.err = 'Open this page while signed in to claude.ai, with access shared by the owner.'; refresh(true); return; }

    var me = userCap ? userCap.me() : Promise.resolve({ id: null, name: '' });

    var cw = userCap ? userCap.can('data.write') : Promise.resolve(null);

    return Promise.all([me, cw]).then(function (v) {

      var wp=workingProfile(); S.myId = wp.id==='wife'?'wife':'owner'; S.myName = wp.name || '[Your name]'; S.canWrite = v[1] !== false; S.people = {};

      var onErr = function (e) { console.error(e); S.err = 'The pipeline could not load (' + (e && e.code || 'error') + '). Reload the page.'; refresh(true); };

      db.collection('leads').onSnapshot(function (snap) {

        S.leads = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

        if (firstLeads) { firstLeads = false; ready(); }

        loadPeople(); if (S.ready) refresh(false);

      }, onErr);

      db.collection('activity').orderBy('at', 'desc').limit(1000).onSnapshot(function (snap) {

        S.acts = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

        if (firstActs) { firstActs = false; ready(); }

        loadPeople(); if (S.ready) refresh(false);

      }, onErr);

      db.collection('templates').onSnapshot(function (snap) {

        S.templates = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

        if (firstTpl) { firstTpl = false; ready(); }

        if (S.ready) refresh(false);

      }, onErr);

      var iv = setInterval(function () { if (S.ready && !S.openId && !S.modal) { renderTop(); if (S.tab === 'dashboard' || S.tab === 'today' || S.tab === 'board') renderView(false); } }, 60000);

      window.addEventListener('pagehide', function () { clearInterval(iv); });

      setTimeout(function () { if (!S.ready) { S.ready = true; refresh(true); } }, 4000);

      // first paint of data

      var wait = setInterval(function () { if (S.ready) { clearInterval(wait); refresh(true); } }, 120);

    });

  }).catch(function (e) { console.error(e); S.err = e.message || 'The pipeline could not start. Reload the page.'; refresh(true); });

}

boot();

})();
