<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form definitions</title><meta name="robots" content="noindex"></head>
<body>
<!-- Static copy of the quote form so Netlify Forms always detects it at deploy time. Not linked anywhere. -->
<form name="quote" method="POST" data-netlify="true" netlify-honeypot="company_website" hidden>
  <input type="hidden" name="form-name" value="quote">
  <input name="company_website">
  <input name="firstName"><input name="lastName"><input name="phone"><input name="email">
  <input name="address"><input name="propertyType"><input name="projectType"><input name="sqft"><input name="date">
  <textarea name="message"></textarea>
  <input type="file" name="photos" multiple>
</form>
</body></html>
